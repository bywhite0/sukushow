<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1930" />
    <link rel="icon" href="data:," />
    <title>llll × PJSK 渲染预览（60 轨）</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #081018;
        color: #e6edf7;
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
      }
      #preview-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .panel {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        max-width: min(420px, 92vw);
        padding: 12px 14px;
        border: 1px solid #22304a;
        border-radius: 10px;
        background: rgba(8, 16, 24, 0.86);
        backdrop-filter: blur(6px);
        font-size: 13px;
        line-height: 1.7;
      }
      .panel h1 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }
      .panel .hint {
        color: #8fa3bf;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 8px;
      }
      button,
      label.file {
        padding: 6px 12px;
        border: 1px solid #2c405f;
        border-radius: 6px;
        background: #142033;
        color: #dce7f5;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover,
      label.file:hover {
        background: #1d2d45;
      }
      input[type='file'] {
        display: none;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #9fd0ff;
        min-height: 1.4em;
      }
      #stats {
        margin-top: 4px;
        font-size: 11px;
        color: #7f93ad;
        font-variant-numeric: tabular-nums;
      }
      .err {
        color: #ff9a9a;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <canvas id="preview-canvas"></canvas>
    <div class="panel">
      <h1>llll × PJSK 渲染预览 · 60 轨</h1>
      <div class="hint">llll 原生谱面直接喂进 PJSK 渲染管线，轨道参数化为 60。</div>
      <div class="row">
        <label class="file">
          ＋ 打开谱面
          <input id="chart-file" type="file" accept=".json,.bytes" />
        </label>
        <button id="play">播放</button>
        <button id="restart">重播</button>
      </div>
      <div id="status">正在加载渲染器…</div>
      <div id="stats"></div>
    </div>
  </body>
</html>
